# CNB is the source of truth; push branches and tags to the GitHub mirror.

$:
  api_trigger_image_transport:
    - name: Build RK3588 image transport
      runner:
        tags: cnb:arch:amd64
        cpus: 4
      git:
        submodules: false
      services:
        - docker
      docker:
        image: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/daily-env:latest
        volumes:
          - elf2-sdk-v1:/cache/elf2-sdk:copy-on-write
      stages:
        - name: Cross compile with pinned SDK
          script: sh 10-env/build-image-transport.sh /tmp/image-transport-build
          timeout: 15m
        - name: Publish binary and build identity
          script: |
            set -eu
            IMAGE="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/image-transport:build-${CNB_BUILD_ID}"
            docker build --platform linux/arm64 -f 03-apps/rk3588/Dockerfile.artifact -t "$IMAGE" /tmp/image-transport-build
            docker push "$IMAGE"
            docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE"
          timeout: 10m

  tag_push:
    - &sync_tags_to_github
      name: Sync tags to GitHub
      stages:
        - name: Configure GitHub SSH on port 443
          script: git config core.sshCommand 'ssh -o UserKnownHostsFile=/workspace/.cnb/github-known-hosts -o StrictHostKeyChecking=yes -o ConnectTimeout=30'
        - name: Sync tags
          image: tencentcom/git-sync
          settingsFrom:
            - https://cnb.cool/fu1fan/secrets/-/blob/main/vibrareveal-github-sync.yml
          settings:
            target_url: ssh://git@ssh.github.com:443/fu1fan/VibraReveal.git
            push_tags: true

  # 日常开发：轻量镜像，SDK 在首次编译时按 digest 加载。
  vscode:
    - name: VibraReveal dev environment
      git:
        submodules: false
      services:
        - vscode
        - docker
      runner:
        tags: cnb:arch:amd64
        cpus: 8
      docker:
        image: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/daily-env:latest
        volumes:
          - elf2-sdk-v1:/cache/elf2-sdk:copy-on-write
          - /cache/elf2-app-ccache:copy-on-write
          - /root/.cache/pip:copy-on-write
      stages:
        # 把 WebIDE / CodeBuddy / Remote-SSH 的个人状态软链到 ~/.cnb，交给文件漫游持久化。
        - name: Restore persistent IDE state
          script: bash 10-env/persist.sh
      endStages:
        - name: Report persistent IDE state
          script: bash 10-env/persist.sh --report

  # 手动入口：页面按钮触发，重建并发布镜像（与 dev-env-v* Tag 触发等价，标签可自定）。
  # 按钮定义见 .cnb/web_trigger.yml。
  web_trigger_publish_env:
    - &publish_env
      name: Publish dev environment image (manual)
      runner:
        tags: cnb:arch:amd64
        cpus: 8
      git:
        submodules: false
      services:
        - docker
      lock:
        key: dev-env-image-publish
        wait: true
        timeout: 7200
        expires: 7200
      stages:
        - name: Build image
          script: |
            set -eu
            IMAGE_TAG="${image_tag:-dev-env-manual}"
            IMAGE="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/daily-env"
            IMAGE="$IMAGE:latest" bash 10-env/build-image.sh "$IMAGE:$IMAGE_TAG"
        - name: Push image
          script: |
            set -eu
            IMAGE_TAG="${image_tag:-dev-env-manual}"
            IMAGE="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/daily-env"
            docker push "$IMAGE:$IMAGE_TAG"
            docker push "$IMAGE:latest"

  api_trigger_publish_env:
    - *publish_env

  api_trigger_publish_system_env:
    - <<: *publish_env
      name: Publish full system environment
      git:
        submodules: true
      stages:
        - name: Build and publish system environment
          script: |
            set -eu
            IMAGE="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/system-env:build-${CNB_BUILD_ID}"
            MODE=system IMAGE="$IMAGE" bash 10-env/build-image.sh
            docker push "$IMAGE"
            docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE"

  # 手动入口：用同一个镜像验证开发环境可用（云原生构建侧）。
  web_trigger_env_check:
    - &env_check
      name: dev-env-selftest
      runner:
        tags: cnb:arch:amd64
        cpus: 8
      git:
        submodules: false
      services:
        - docker
      docker:
        image: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/daily-env:latest
        volumes:
          - elf2-sdk-v1:/cache/elf2-sdk:copy-on-write
      stages:
        - name: Environment report
          script: sh /usr/local/lib/dev-env-smoke-test.sh daily
        - name: Python dependencies
          script: |
            cd 04-algorithms/phase-motion
            python3 -c "import numpy, cv2, matplotlib; print('numpy', numpy.__version__, 'cv2', cv2.__version__, 'matplotlib', matplotlib.__version__)"
        - name: Cross compiler and offline SDK cache
          script: bash 10-env/check-sdk.sh
        - name: Verify full system environment workspace access
          script: |
            set -eu
            IMAGE=$(python3 -c 'import json; print(json.load(open("10-env/system.lock.json"))["image"])')
            docker run --rm --platform linux/amd64 \
              --mount type=bind,src=/workspace,dst=/workspace,readonly \
              "$IMAGE" bash -c 'test -f /workspace/10-env/sdk.lock.json && command -v elf2-build && test -s /opt/elf2-deps/.manifest-sha256'

  api_trigger_env_check:
    - *env_check

"**":
  push:
    - name: Sync to GitHub
      stages:
        - name: Configure GitHub SSH on port 443
          script: git config core.sshCommand 'ssh -o UserKnownHostsFile=/workspace/.cnb/github-known-hosts -o StrictHostKeyChecking=yes -o ConnectTimeout=30'
        - name: Sync current branch and tags
          image: tencentcom/git-sync
          settingsFrom:
            - https://cnb.cool/fu1fan/secrets/-/blob/main/vibrareveal-github-sync.yml
          settings:
            target_url: ssh://git@ssh.github.com:443/fu1fan/VibraReveal.git
            branch: ${CNB_BRANCH}
            push_tags: true

# 开发环境镜像只在推送 dev-env-v* 形式的 Tag 时重建并发布，普通分支提交不触发，
# 日常镜像不包含系统固定依赖；完整环境通过独立 API 入口发布。
# 用法：git tag dev-env-v1.0.0 && git push origin dev-env-v1.0.0
"dev-env-v*":
  tag_push:
    - name: Publish dev environment image
      runner:
        tags: cnb:arch:amd64
        cpus: 8
      git:
        submodules: false
      services:
        - docker
      lock:
        key: dev-env-image-publish
        wait: true
        timeout: 7200
        expires: 7200
      stages:
        - name: Build image
          script: |
            set -eu
            IMAGE="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/daily-env"
            IMAGE="$IMAGE:latest" bash 10-env/build-image.sh "$IMAGE:${CNB_BRANCH}"
        - name: Push image
          script: |
            set -eu
            IMAGE="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/daily-env"
            docker push "$IMAGE:${CNB_BRANCH}"
            docker push "$IMAGE:latest"
    # 该 Tag 也按仓库约定同步到 GitHub；用 & 锚点复用上面的任务定义。
    - <<: *sync_tags_to_github
